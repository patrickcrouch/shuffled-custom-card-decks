<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Deck App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1 class="app-title">My Card Decks</h1>
            <button class="add-deck-btn" id="addDeckBtn" title="Create New Deck">+</button>
        </header>
        
        <main class="decks-container" id="decksContainer">
            <!-- Empty state shown when no decks exist -->
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon"></div>
                <h2>No decks yet</h2>
                <p>Click the + button above to create your first custom card deck</p>
            </div>
            
            <!-- Deck cards will be dynamically added here -->
        </main>
        
        <!-- Deck Creation Modal -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="deck-creation-modal">
                <div class="modal-header">
                    <h2 class="modal-title">Create Custom Deck</h2>
                    <button class="close-btn" id="closeModal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="filter-section">
                        <div class="filter-header" data-filter="custom">
                            <span class="filter-title">Custom Filter</span>
                            <span class="chevron">▼</span>
                        </div>
                        <div class="filter-content" id="customFilterContent">
                            <div class="filter-description">
                                Select specific cards to include in your custom deck. Give your filter a name and choose which cards to include.
                            </div>
                            
                            <input type="text" class="custom-filter-name" id="customFilterName" placeholder="Enter filter name (e.g., 'My Favorite Cards')">
                            
                            <div class="card-grid" id="cardGrid">
                                <!-- Cards will be generated here -->
                            </div>
                        </div>
                    </div>
                    
                    <button class="create-deck-btn" id="createDeckBtn" disabled>Create Deck</button>
                </div>
            </div>
        </div>
    </div>

    <!-- <script src="js/main.js"></script> -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
